spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081

logging:
  level:
    org.springframework: DEBUG
    org.springdoc: DEBUG     # 👈 para ver por qué rompe la generación

springdoc:
  api-docs:
    enabled: true            # 👈 explícito
    path: /v3/api-docs
  swagger-ui:
    enabled: true            # 👈 explícito
    path: /swagger-ui.html
  use-fqn: true              # 👈 evita choques de nombres (muy común)
  # remove-broken-reference-definitions: true  # opcional: ignora refs rotas
