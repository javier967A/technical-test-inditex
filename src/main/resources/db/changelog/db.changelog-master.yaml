databaseChangeLog:
  - changeSet:
      id: 001-create-brands
      author: you
      changes:
        - createTable:
            tableName: brands
            columns:
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(50), constraints: { nullable: false } }

  - changeSet:
      id: 002-create-prices
      author: you
      changes:
        - createTable:
            tableName: prices
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: brand_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: start_date, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: end_date, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: price_list, type: INT, constraints: { nullable: false } }
              - column: { name: product_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: priority, type: INT, constraints: { nullable: false } }
              - column: { name: price, type: DECIMAL(19,4), constraints: { nullable: false } }
              - column: { name: currency, type: VARCHAR(3), constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: prices
            baseColumnNames: brand_id
            referencedTableName: brands
            referencedColumnNames: id
            constraintName: fk_prices_brand

  - changeSet:
      id: 003-seed-dev-test
      author: you
      context: dev,test
      changes:
        - insert: { tableName: brands, columns: [ { column: { name: id, valueNumeric: 1 } }, { column: { name: name, value: "ZARA" } } ] }
        - insert:
            tableName: prices
            columns:
              - column: { name: brand_id, valueNumeric: 1 }
              - column: { name: start_date, valueDate: "2020-06-14T00:00:00" }
              - column: { name: end_date, valueDate: "2020-12-31T23:59:59" }
              - column: { name: price_list, valueNumeric: 1 }
              - column: { name: product_id, valueNumeric: 35455 }
              - column: { name: priority, valueNumeric: 0 }
              - column: { name: price, valueNumeric: 35.50 }
              - column: { name: currency, value: "EUR" }
